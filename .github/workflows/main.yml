name: Deploy Delivery-PWA (Bun) to EC2

on:
  push:
    branches:
      - main   # change if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Go to project directory"
            cd ~/Delivery-PWA

            echo "Reset repo"
            git fetch origin
            git reset --hard origin/main

            echo "Install dependencies with Bun"
            bun install

            echo "Run unit tests"
            bun test

            echo "Build Next.js app"
            bun run build

            echo "Restart app with PM2"
            pm2 restart pwa || pm2 start ./startup.sh --name pwa

            echo "Save PM2"
            pm2 save

            echo "Deployment completed"
